server:
  port: "8080"
  read_timeout: 30s
  write_timeout: 30s
  max_header_bytes: 1048576
  
  # API validation configuration
  validation:
    enabled: true
    spec_path: "docs/openapi.yaml"
    strict_mode: false

router:
  default_strategy: "cost_optimized"
  health_check_interval: 30s
  max_cost_threshold: 1.0
  enable_fallback_chaining: true
  request_timeout: 120s
  
  # Default retry configuration (can be overridden per request)
  default_retry:
    max_attempts: 3
    backoff_type: "exponential"
    base_delay: 1s
    max_delay: 30s
    retryable_errors: ["timeout", "connection", "unavailable", "rate limit"]
  
  # Default fallback configuration (can be overridden per request)
  default_fallback:
    enabled: true
    max_cost_increase: 0.5  # Allow up to 50% cost increase for fallback
    require_same_features: true

providers:
  # The full catalog, generated 2026-10-05 from ONE table so that this file,
  # internal/config/config.go's setDefaults() and pkg/clear/cost.go cannot
  # drift apart. TestCatalogModelsArePriced and TestDefaultCatalogMatchesYAML
  # enforce the coupling; both had blind spots before this change (the price
  # test reads THIS file, and OpenAI was commented out here, so the Go
  # defaults' OpenAI rates went unchecked and had drifted - gpt-4o was
  # 0.005/0.015 in the defaults against 0.00250/0.01000 in cost.go).
  #
  # Scope: every model the vendor's own /v1/models reports for this account
  # AND for which the vendor publishes a per-token rate. Excluded on purpose:
  # dated snapshots (same rate as the base id, pure bloat), `-chat-latest`
  # floating aliases (same objection as a floating image tag - you cannot say
  # what is running), gpt-5.1/5.2-codex* (on the account, no published rate),
  # o3-pro (published rate, NOT on the account), and gpt-live-1 (billed per
  # minute, so it has no per-1K rate to put here).
  #
  # max_context_window / max_output_tokens of 0 mean NOT ADVERTISED, which
  # both limit paths treat as "no cap" (EffectiveOutputTokens skips v<=0,
  # ExceedsContext returns false on window<=0). That is deliberate wherever
  # the published limits were not verified: an understated max_output_tokens
  # is not inert - ApplyOutputCap MUTATES max_tokens down to it and would
  # silently truncate the caller's request. Filling these in is OPS-53.

  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    timeout: 120s
    models:
