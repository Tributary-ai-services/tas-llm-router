gatekeeper:
  enabled: true
  fail_open: true
  honor_attestations: true
  scan_timeout: 30s
  inbound:
    enabled: true
    scan_profile: "full"
    trust_tier: "internal"
    block_on_critical: false   # Don't block internal service requests with document content
    scan_policy:
      always_scan_roles: ["user"]
      never_scan_roles: ["assistant"]
  outbound:
    enabled: true
    scan_profile: "full"
    trust_tier: "partner"
    block_on_critical: false   # Log but don't block - document content may trigger false positives
  # AIQG shadow payload-reduction extractor (Plan #7 Phase 2). Off by default;
  # enabled only on the AIQG gateway (env AIQG_EXTRACTION_ENABLED=true). Shadow
  # mode measures relevance-based context reduction without mutating payloads.
  extraction:
    enabled: false
    ollama_url: "http://ollama.tas-shared:11434"   # AIQG_EXTRACTION_OLLAMA_URL
    embed_model: "all-minilm"                       # AIQG_EXTRACTION_EMBED_MODEL
    min_content_size: 2000                          # AIQG_EXTRACTION_MIN_CONTENT_SIZE (bytes)
    # Optional SLM rewrite/compression step (Plan #7). Relevance always runs on
    # Ollama; the SLM step can run on a cloud model so it works without a local
    # GPU. Off by default — enabling it makes a cloud LLM call per reduced
    # request (cost + latency), so measure net savings before leaving it on.
    slm_enabled: false                              # AIQG_EXTRACTION_SLM_ENABLED
    slm_provider: "openai"                          # AIQG_EXTRACTION_SLM_PROVIDER (ollama|openai|anthropic)
    slm_model: "gpt-4o-mini"                        # AIQG_EXTRACTION_SLM_MODEL
    slm_base_url: ""                                # AIQG_EXTRACTION_SLM_BASE_URL (blank = provider default)
    slm_api_key: ""                                 # AIQG_EXTRACTION_SLM_API_KEY (from secret)
    slm_max_tokens: 1024                            # AIQG_EXTRACTION_SLM_MAX_TOKENS

logging:
  level: "info"
  format: "json"
  output: "stdout"

security:
  api_keys: []
  rate_limiting:
    enabled: false
    requests_per_minute: 60
    burst_size: 10
    window_duration: 1m
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]
  request_validation:
    max_request_size: 10485760  # 10MB
    max_message_length: 100000
    max_messages: 50

# AIQG (AI Quality Gateway) ingress
#
# When enabled, mounts the AIQG middleware on the three completion routes
# (/v1/chat/completions, /v1/completions, /v1/messages). Permissive mode
# (strict: false) is the default: internal callers without TAS-Auth pass
# through untouched; customer-facing requests with TAS-Auth + Authorization
# enter Path A and emit paired CloudEvents via the LogEmitter → Loki path.
#
# Strict mode (strict: true) returns 401 on any request missing TAS-Auth or
# Authorization — use only on a customer-facing ingress (gateway.aiqg.tas.io).
#
# Tokens: the in-memory MVP store. Omit the list (or omit the whole aiqg
# block) and the middleware accepts any TAS-Auth as opaque — events emit
# with empty tenant fields. Populate to enable tenant attribution before
# the dashboard-backed Resolver ships.
#
# Env-var overrides: AIQG_ENABLED, AIQG_STRICT, AIQG_REGION.
aiqg:
  enabled: false
  strict: false
  region: ""
  tokens: []
  # Example token entry:
  # tokens:
  #   - token_id: "7c8d5e2a-1a4b-4d2c-9e3f-1234567890ab"   # UUID FK to aiqg_token table
  #     token: "tas_qg_live_abc123"                          # the actual bearer
  #     tenant_id: "tenant-a"
  #     aiqg_account_id: "account-a"
  #     source_app: "billing-api-prod"
  #     suspended: false

  # Emitter sink for AIQG events. Env override: AIQG_EMITTER_TYPE.
  #   "log"   — logrus → Loki (default; works without infra)
  #   "kafka" — sarama SyncProducer → Kafka topic (durable, partitioned)
  #   "both"  — fan out to both (transitional / debugging)
  emitter_type: "log"
  # Kafka broker config, used when emitter_type is "kafka" or "both".
  # Env overrides: AIQG_KAFKA_BROKERS (comma-separated), AIQG_KAFKA_TOPIC.
  kafka:
    brokers: []
    topic: ""

  # Dashboard backend integration. When BOTH dashboard_url +
  # dashboard_internal_auth_token are set, the AIQG middleware uses
  # a DashboardResolver (HTTP client of aiqg-dashboard-be's
  # /internal/auth/validate endpoint) INSTEAD of the in-memory
  # `tokens:` list above. The Tokens list becomes a bootstrap
  # fallback for when the dashboard-be is degraded at startup.
  #
  # Env overrides:
  #   AIQG_DASHBOARD_URL
  #   AIQG_DASHBOARD_INTERNAL_AUTH_TOKEN
  dashboard_url: ""
  dashboard_internal_auth_token: ""