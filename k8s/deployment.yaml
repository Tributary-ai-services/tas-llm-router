apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: tas-llm-router
  labels:
    app: llm-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      # No wait-for-postgres: the router never contacts Postgres, so gating
      # every new pod on its reachability only added a startup dependency the
      # app does not use (#177).
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis-shared.tas-shared 6379; do echo waiting for redis; sleep 2; done']

      containers:
      - name: llm-router
        image: llm-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: llm-router-config
        - secretRef:
            name: llm-router-secret

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Points the AIQG token-resolver at the Secret-mounted file.
        # When the Secret isn't present (volume is optional), the binary
        # logs a warning and runs in the no-resolver permissive path.
        - name: AIQG_TOKENS_FILE
          value: /app/secrets/aiqg/aiqg-tokens.yaml
        # AIQG payload-reduction extractor (Plan #7 Phase 4 Slice D) — rolled
        # cluster-wide so the apply path works on the main gateway too, not
        # just llm-router-aiqg. Embeddings-only (all-minilm); SLM off (no GPU).
        # Active reduction is per-bundle (spec.reduction.mode) + ramp/kill-switch
        # /auto-rollback gated. Break-glass: AIQG_EXTRACTION_APPLY_DISABLED=true.
        - name: AIQG_EXTRACTION_ENABLED
          value: "true"
        - name: AIQG_EXTRACTION_OLLAMA_URL
          value: http://ollama.tas-shared:11434
        - name: AIQG_EXTRACTION_EMBED_MODEL
          value: all-minilm
        - name: AIQG_EXTRACTION_MIN_CONTENT_SIZE
          value: "2000"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        livenessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        # AIQG token list — mounted from a Secret rather than a ConfigMap
        # because token bearers are sensitive. The binary reads this via
        # AIQG_TOKENS_FILE (set on the env block).
        - name: aiqg-tokens
          mountPath: /app/secrets/aiqg
          readOnly: true

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: aiqg-tokens
        secret:
          secretName: llm-router-aiqg-tokens
          # Optional so the Deployment still starts when the Secret
          # hasn't been applied yet — the AIQG middleware just runs in
          # the no-resolver permissive path until it lands.
          optional: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - llm-router
              topologyKey: kubernetes.io/hostname

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
