apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: tas-llm-router
  labels:
    app: llm-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      # No wait-for-postgres: the router never contacts Postgres, so gating
      # every new pod on its reachability only added a startup dependency the
      # app does not use (#177).
      #
      # NOTE (2026-09-19): the LIVE Deployments still have that init container
      # — they have not been rolled since 2025-11-20, so the cluster predates
      # this decision. It is harmless while Postgres is up and will disappear
      # on the next real deploy. Do not re-add it here to quieten kubectl diff.
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis-shared.tas-shared 6379; do echo waiting for redis; sleep 2; done']

      containers:
      - name: llm-router
        image: llm-router:aiqg-v5.75
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: llm-router-config
        - secretRef:
            name: llm-router-secret


        env:
        # Timeouts: these existed ONLY on the live Deployment until 2026-09-19 —
        # in no manifest and in no ConfigMap — so nothing in git recorded how
        # long the router waits.
        - name: SERVER_READ_TIMEOUT
          value: "180s"
        - name: SERVER_WRITE_TIMEOUT
          value: "180s"
        - name: ROUTER_REQUEST_TIMEOUT
          value: "150s"
        # KAFKA_BROKERS is ALSO in llm-router-config as kafka-shared.tas-shared:9092
        # (the headless Service). This explicit entry overrides it with broker
        # pod-0 directly, and an explicit env silently beats envFrom — so the
        # ConfigMap value has not been in effect. Both addresses were verified
        # reachable on 2026-09-19: the Service is headless, so its name resolves
        # straight to the broker pod. The override buys nothing today and would
        # become wrong the moment a second broker existed or pod-0 were renamed.
        # Recorded as-is rather than corrected, because removing it changes what
        # a running pod connects to and deserves its own change.
        - name: KAFKA_BROKERS
          value: "kafka-shared-0.kafka-shared.tas-shared.svc.cluster.local:9092"
        # redis-shared requires a password
        #
        # AIQG_LINKAGE_REDIS_URL is also set in llm-router-config, which this
        # Deployment pulls in via envFrom. That copy has no password and
        # CANNOT get one: Kubernetes expands $(VAR) only in env[].value, never
        # in a value sourced from a ConfigMap. Declaring it here overrides the
        # envFrom copy (an explicit env entry wins) and is the only place the
        # interpolation works. Leave the ConfigMap key alone — a password does
        # not belong in a ConfigMap, which is the SEC-21 lesson.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-shared-auth
              key: password
        - name: AIQG_LINKAGE_REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-shared.tas-shared.svc.cluster.local:6379"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Points the AIQG token-resolver at the Secret-mounted file.
        # When the Secret isn't present (volume is optional), the binary
        # logs a warning and runs in the no-resolver permissive path.
        - name: AIQG_TOKENS_FILE
          value: /app/secrets/aiqg/aiqg-tokens.yaml
        # AIQG payload-reduction extractor (Plan #7 Phase 4 Slice D) — rolled
        # cluster-wide so the apply path works on the main gateway too, not
        # just llm-router-aiqg. Embeddings-only (all-minilm); SLM off (no GPU).
        # Active reduction is per-bundle (spec.reduction.mode) + ramp/kill-switch
        # /auto-rollback gated. Break-glass: AIQG_EXTRACTION_APPLY_DISABLED=true.
        - name: AIQG_EXTRACTION_ENABLED
          value: "true"
        - name: AIQG_EXTRACTION_OLLAMA_URL
          value: http://ollama.tas-shared:11434
        - name: AIQG_EXTRACTION_EMBED_MODEL
          value: all-minilm
        - name: AIQG_EXTRACTION_MIN_CONTENT_SIZE
          value: "2000"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        livenessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        # AIQG token list — mounted from a Secret rather than a ConfigMap
        # because token bearers are sensitive. The binary reads this via
        # AIQG_TOKENS_FILE (set on the env block).
        - name: aiqg-tokens
          mountPath: /app/secrets/aiqg
          readOnly: true

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: aiqg-tokens
        secret:
          secretName: llm-router-aiqg-tokens
          # Optional so the Deployment still starts when the Secret
          # hasn't been applied yet — the AIQG middleware just runs in
          # the no-resolver permissive path until it lands.
          optional: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - llm-router
              topologyKey: kubernetes.io/hostname

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
