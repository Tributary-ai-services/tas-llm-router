# Customer-facing strict-mode Deployment for the AIQG gateway.
#
# Same binary as the internal Deployment; the only behavioral
# difference is AIQG_STRICT=true via the env override below, which
# flips the Path A middleware into "401 on missing TAS-Auth or
# Authorization" mode (per build-vs-reuse §7.3 strict resolution).
#
# Shares the same llm-router-config ConfigMap (via envFrom) and the
# same llm-router-secret API-keys Secret. The AIQG_STRICT override
# in env: takes precedence over the ConfigMap value (which is false
# for the internal Deployment).
#
# Token-resolver Secret (llm-router-aiqg-tokens) is mounted optional;
# until populated, even strict mode accepts any TAS-Auth as opaque
# per the documented incremental-rollout path (PRs #22, #26).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router-aiqg
  namespace: tas-llm-router
  labels:
    app: llm-router-aiqg
    aiqg-mode: strict
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-router-aiqg
  template:
    metadata:
      labels:
        app: llm-router-aiqg
        aiqg-mode: strict
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-shared.tas-shared 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis-shared.tas-shared 6379; do echo waiting for redis; sleep 2; done']

      containers:
      - name: llm-router
        image: llm-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: llm-router-config
        - secretRef:
            name: llm-router-secret

        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Strict-mode override — wins over the AIQG_STRICT value in
        # the ConfigMap (which is "false" for the internal Deployment).
        - name: AIQG_STRICT
          value: "true"
        # Shared token store with the internal Deployment.
        - name: AIQG_TOKENS_FILE
          value: /app/secrets/aiqg/aiqg-tokens.yaml
        # AIQG payload-reduction shadow extractor (Plan #7 Phase 2a).
        # Enabled on the AIQG gateway ONLY — the internal llm-router
        # Deployment leaves these unset so it never runs the extractor.
        # Embeddings-only relevance step via Ollama (all-minilm); the SLM
        # step needs a GPU and stays disabled.
        - name: AIQG_EXTRACTION_ENABLED
          value: "true"
        - name: AIQG_EXTRACTION_OLLAMA_URL
          value: http://ollama.tas-shared:11434
        - name: AIQG_EXTRACTION_EMBED_MODEL
          value: all-minilm
        - name: AIQG_EXTRACTION_MIN_CONTENT_SIZE
          value: "2000"
        # SLM condensation step for the extractor. Routed at the vendor
        # (claude-haiku) rather than a local GPU, so unlike the comment
        # above this one IS enabled here.
        - name: AIQG_EXTRACTION_SLM_ENABLED
          value: "true"
        - name: AIQG_EXTRACTION_SLM_PROVIDER
          value: anthropic
        - name: AIQG_EXTRACTION_SLM_MODEL
          value: claude-haiku-4-5-20251001
        - name: AIQG_EXTRACTION_SLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-router-secret
              key: ANTHROPIC_API_KEY

        # Gatekeeper inbound redaction. "replace" is a DETERMINISTIC
        # strategy, which is what makes the redacted prompt byte-stable
        # and therefore cache-safe — the C1 key is hashed over
        # post-redaction messages.
        - name: GATEKEEPER_REDACT_ENABLED
          value: "true"
        - name: GATEKEEPER_REDACT_STRATEGY
          value: replace

        # Flow/step linkage store.
        - name: AIQG_LINKAGE_REDIS_URL
          value: redis://redis-shared.tas-shared.svc.cluster.local:6379

        # C1 exact-match response cache. Only caches deterministic,
        # non-streaming, tool-free requests (responsecache.Decide).
        - name: AIQG_RESPONSE_CACHE_ENABLED
          value: "true"
        - name: AIQG_RESPONSE_CACHE_TTL
          value: 10m
        - name: AIQG_RESPONSE_CACHE_IN_EXPERIMENTS
          value: "true"

        # C4 semantic response cache. SHADOW=true is the global default:
        # candidates are logged but never served. Serving is a per-tenant
        # opt-in via the aiqg.cache_config row (semantic.shadow=false),
        # because a semantic hit is probabilistic and a wrong one is a
        # correctness bug, not a slower response.
        - name: AIQG_SEMCACHE_ENABLED
          value: "true"
        - name: AIQG_SEMCACHE_SHADOW
          value: "true"
        - name: AIQG_SEMCACHE_REDIS_URL
          value: redis://redis-semcache.tas-shared.svc.cluster.local:6379
        - name: AIQG_SEMCACHE_OLLAMA_URL
          value: http://ollama.tas-shared:11434
        # Embedder: TEI serving redis/langcache-embed-v3-small, which is
        # purpose-trained for CACHE MATCHING (negation in its eval set) rather
        # than retrieval. EMBED_MODEL is unused on the TEI path — TEI pins its
        # model with --model-id — but is kept so a rollback to ollama is a
        # one-line change.
        - name: AIQG_SEMCACHE_EMBED_MODEL
          value: all-minilm
        - name: AIQG_SEMCACHE_EMBED_PROVIDER
          value: tei
        - name: AIQG_SEMCACHE_TEI_URL
          value: http://tei.tas-shared:8080
        - name: AIQG_SEMCACHE_DIM
          value: "384"
        # Raised 0.85 -> 0.87 on 2026-08-16. Calibration against this
        # embedder (pkg/aiqg/semcache/calibrate_live_test.go) measured
        # FPR 11.1% at 0.85: nuance-only near-misses such as
        #   "renew my VPN certificate"   vs "reset my VPN certificate"   0.8695
        #   "encrypt employee data at rest" vs "…customer data at rest"  0.8655
        # carry no entity/number/date/negation difference, so every L2
        # guard passes and this threshold is the ONLY defence. FPR
        # reaches 0% at 0.87. Per-tenant cache_config may only TIGHTEN
        # this, never loosen it. Re-calibrate before changing, and note
        # all-minilm separates these classes poorly (separation -0.33) —
        # a better embedder, not a lower threshold, is the way to raise
        # hit rate.
        # 0.93 is langcache-embed-v3-small's calibrated FPR=0 point, NOT 0.87
        # (that was all-minilm's). Cutting the embedder without moving the
        # threshold would knowingly ship a config measured to produce false
        # hits, since the two models score the same pair differently.
        - name: AIQG_SEMCACHE_MIN_SIMILARITY
          value: "0.93"
        - name: AIQG_SEMCACHE_TTL
          value: 30m
        - name: AIQG_SEMCACHE_JUDGE_ENABLED
          value: "true"

        # tcpSocket (not httpGet /health) matches the live internal
        # Deployment pattern. The /health endpoint legitimately returns
        # 503 in some configurations (Gatekeeper degraded, upstream
        # checks failing) which kills the liveness probe; tcpSocket
        # only checks that the process is binding the port. The
        # /health endpoint itself remains available for ad-hoc probing.
        livenessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: aiqg-tokens
          mountPath: /app/secrets/aiqg
          readOnly: true

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      - name: aiqg-tokens
        secret:
          secretName: llm-router-aiqg-tokens
          optional: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["llm-router-aiqg"]
              topologyKey: kubernetes.io/hostname
