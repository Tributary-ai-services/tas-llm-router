# TEMPLATE — DO NOT APPLY THIS FILE DIRECTLY.
#
# This is the schema reference for the llm-router-secret. The real
# Secret holds production LLM provider API keys and is managed
# out-of-band by ops (sealed-secrets / external-secrets / SOPS /
# direct kubectl create — pick your tooling).
#
# Applying this file as-is wipes the live keys with empty strings
# (incident: ~6 minutes of routing failures during the PR #26 rollout
# on 2026-06-03). This file is intentionally NOT registered in
# k8s/kustomization.yaml so `kubectl apply -k k8s/` does not touch
# the Secret.
#
# To populate real values from a sourced .env:
#   set -a; . /path/to/.env; set +a
#   kubectl create secret generic llm-router-secret \
#     -n tas-llm-router \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: llm-router-secret
  namespace: tas-llm-router
  labels:
    app: llm-router
type: Opaque
stringData:
  # OpenAI
  OPENAI_API_KEY: ""

  # Anthropic
  ANTHROPIC_API_KEY: "sk-ant-placeholder-key-for-development"

  # Google (Gemini)
  GOOGLE_API_KEY: ""

  # Azure OpenAI
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""

  # AWS Bedrock
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"

  # Cohere
  COHERE_API_KEY: ""

  # Hugging Face
  HUGGINGFACE_API_KEY: ""

  # Together AI
  TOGETHER_API_KEY: ""

  # Replicate
  REPLICATE_API_KEY: ""

  # Database Password (if not using full connection string)
  DATABASE_PASSWORD: "taspassword"

  # Redis Password (if required)
  REDIS_PASSWORD: ""

  # JWT Secret for internal authentication
  JWT_SECRET: "your-secure-jwt-secret-change-in-production"
