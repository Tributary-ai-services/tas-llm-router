apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-router-config
  namespace: tas-llm-router
  labels:
    app: llm-router
data:
  # Server Configuration
  LLM_ROUTER_PORT: "8086"
  LLM_ROUTER_LOG_LEVEL: "info"
  LLM_ROUTER_LOG_FORMAT: "json"
  LLM_ROUTER_DEFAULT_STRATEGY: "cost_optimized"

  # Redis Configuration (Shared)
  REDIS_URL: "redis://redis-shared.tas-shared:6379"
  REDIS_DB: "0"

  # PostgreSQL: intentionally omitted. The router does not connect to
  # Postgres (no DATABASE_URL/DATABASE_PASSWORD consumer anywhere in the Go
  # tree), so these keys were vestigial — and DATABASE_URL embedded the
  # password in plaintext in a ConfigMap, which is readable by anything with
  # namespace read access. Removed to close that exposure (#177). If a
  # Postgres dependency is ever added, source the full URL from
  # Secret/llm-router-secret at runtime, never inline it here.

  # Monitoring & Observability
  PROMETHEUS_URL: "http://prometheus-shared.tas-shared:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-shared.tas-shared:4317"
  OTEL_SERVICE_NAME: "llm-router"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production"

  # Kafka Configuration
  KAFKA_BROKERS: "kafka-shared.tas-shared:9092"
  KAFKA_TOPIC_PREFIX: "llm-router"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT_BURST_SIZE: "10"

  # Caching & Performance
  CACHE_ENABLED: "true"
  CACHE_DEFAULT_TTL: "300s"
  CACHE_MAX_SIZE: "1000"
  CONNECTION_POOL_MAX_SIZE: "100"
  CONNECTION_POOL_MAX_IDLE: "10"
  CONNECTION_POOL_TIMEOUT: "30s"
  COMPRESSION_ENABLED: "true"
  COMPRESSION_LEVEL: "6"

  # Analytics
  ANALYTICS_ENABLED: "true"
  ANALYTICS_BATCH_SIZE: "100"
  ANALYTICS_FLUSH_INTERVAL: "60s"
  ANALYTICS_RETENTION_DAYS: "90"

  # Environment
  ENVIRONMENT: "production"
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30s"
  HEALTH_CHECK_TIMEOUT: "5s"
  SHUTDOWN_TIMEOUT: "30s"

  # Gatekeeper (Content Scanning)
  GATEKEEPER_ENABLED: "true"
  GATEKEEPER_FAIL_OPEN: "true"
  GATEKEEPER_SCAN_TIMEOUT: "30s"

  # Feature Flags
  FEATURE_ADVANCED_ROUTING: "true"
  FEATURE_CIRCUIT_BREAKER: "true"
  FEATURE_REQUEST_DEDUPLICATION: "true"
  FEATURE_OPENAI_ASSISTANTS: "true"
  FEATURE_MULTIMODAL_OPTIMIZATION: "true"

  # AIQG (AI Quality Gateway) ingress.
  # Permissive mode on the internal K3s ingress — internal callers without
  # a TAS-Auth header pass through unchanged. Customer-facing requests
  # (with TAS-Auth + Authorization) enter Path A: timing collector +
  # parsed TAS-* headers attached to ctx, paired CloudEvents emitted on
  # response completion via LogEmitter → logrus → Loki.
  # Set AIQG_STRICT=true and route a separate Ingress to this Deployment
  # to host the customer-facing gateway.aiqg.tas.io endpoint.
  AIQG_ENABLED: "true"
  AIQG_STRICT: "false"
  AIQG_REGION: "us-east"
  # Deterministic `linked`-tier attribution (tool_call_id echo index,
  # docs/AIQG-AGENT-FLOW-ATTRIBUTION.md §A). Empty disables linkage.
  AIQG_LINKAGE_REDIS_URL: "redis://redis-shared.tas-shared.svc.cluster.local:6379"
  # LLM-as-judge quality layer (docs/AIQG-EXPERIMENTS-RUNNER.md §6.6). A third
  # model rubric-scores a sampled fraction of responses off the hot path; the
  # score is recorded to aiqg-dashboard-be (/internal/judge) as a feedback
  # signal for per-variant quality. Judge model differs from typical traffic
  # to avoid self-preference bias. Empty model / 0 pct disables judging.
  AIQG_JUDGE_MODEL: "claude-haiku-4-5-20251001"
  AIQG_JUDGE_SAMPLE_PCT: "20"
  # Pairwise shadow-eval (§6.3): % of CONTROL-arm experiment samples to replay
  # through each variant offline + judge head-to-head. ~2× cost per shadow
  # sample, so opt-in (0 = off). Raise per-experiment when a paired quality
  # delta is wanted (pairs naturally with dry_run).
  AIQG_SHADOW_EVAL_PCT: "0"
  # When set, the AIQG middleware uses a DashboardResolver (HTTP
  # client of aiqg-dashboard-be's /internal/auth/validate) instead of
  # the K8s-Secret-mounted token list. The Internal-Auth shared
  # secret comes from llm-router-secret (out-of-band managed) as
  # AIQG_DASHBOARD_INTERNAL_AUTH_TOKEN.
  AIQG_DASHBOARD_URL: "http://aiqg-dashboard-be.aiqg.svc.cluster.local:8095"

  # AIQG event sink. "both" fans paired CloudEvents to logrus
  # (→ Loki, the existing read path used by aiqg-dashboard-be) AND
  # to Kafka topic tas.aiqg.events.v1 (consumed by the Spark
  # aggregator that materializes the aiqg.event_metrics hypertable
  # in TimescaleDB). Keeping the Loki path live during the
  # TimescaleDB cutover is the rollback escape hatch.
  AIQG_EMITTER_TYPE: "both"
  AIQG_KAFKA_BROKERS: "kafka-shared.tas-shared:9092"
  AIQG_KAFKA_TOPIC: "tas.aiqg.events.v1"
