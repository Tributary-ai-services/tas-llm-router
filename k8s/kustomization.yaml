apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tas-llm-router

resources:
- namespace.yaml
- configmap.yaml
# llm-router-secret is intentionally NOT here — see secret.example.yaml
# for the schema. The real Secret is managed out-of-band by ops because
# applying a git-tracked stub overwrote live API keys on 2026-06-03.
- secret-aiqg-tokens.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
# Customer-facing strict-mode AIQG ingress (build-vs-reuse §7.3).
# Same image, AIQG_STRICT=true override, separate Service + Ingress
# at gateway.aiqg.tas.scharber.com.
- deployment-aiqg-strict.yaml
- service-aiqg-strict.yaml
- ingress-aiqg-strict.yaml
# Public API docs at docs.air-ops.net, scoped to /docs only — the host has
# no Cloudflare Access in front of it.
- ingress-docs-airops.yaml

commonLabels:
  app.kubernetes.io/name: llm-router
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: tas

images:
# Ops pushes to registry-api.tas.scharber.com/tas-llm-router — the
# `tas-` prefix differs from this kustomization's local name
# (`llm-router`, matching the deployment.yaml container image). Without
# the prefix, `kubectl apply -k` rewrites the Deployment to pull a
# stale unrelated repo and the live image silently changes on apply.
- name: llm-router
  newName: registry-api.tas.scharber.com/tas-llm-router
  newTag: latest
