apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tas-llm-router

resources:
- namespace.yaml
- configmap.yaml
# llm-router-secret is intentionally NOT here — see secret.example.yaml
# for the schema. The real Secret is managed out-of-band by ops because
# applying a git-tracked stub overwrote live API keys on 2026-06-03.
- secret-aiqg-tokens.yaml
- deployment.yaml
- service.yaml
- ingress.yaml

commonLabels:
  app.kubernetes.io/name: llm-router
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: tas

images:
- name: llm-router
  newName: registry-api.tas.scharber.com/llm-router
  newTag: latest
